services:
  app:
    image: task-manager-1.0:latest
    container_name: task-manager-compose
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/taskmanager
      DB_USERNAME: taskuser
      DB_PASSWORD: taskpass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: task-manager-mysql
    environment:
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - task-manager-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "taskuser", "-ptaskpass"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  task-manager-db-data: